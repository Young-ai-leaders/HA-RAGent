name: Release
on:
  release:
    types:
      - published
      
jobs:
  release_zip_file:
    name: Run automations to build latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Update manifest version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$RELEASE_TAG"
          manifest="${{ github.workspace }}/custom_components/ha_ragent/manifest.json"

          if [ -z "$version" ]; then
            echo "Release tag did not contain a version" >&2
            exit 1
          fi

          jq --arg version "$version" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          jq --exit-status --arg version "$version" '.version == $version' "$manifest"

      - name: Copy and Zip
        if: ${{ github.event_name == 'release' }}
        run: |
          cd '${{ github.workspace }}/custom_components/ha_ragent'
          zip ha_ragent.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2.5.0
        if: ${{ github.event_name == 'release' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          files: "${{ github.workspace }}/custom_components/ha_ragent/ha_ragent.zip"
